name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./app
        run: bunx prisma generate

      - name: Set up environment file
        working-directory: ./app
        run: |
          cp .env.example .env
          # DATABASE_URL is provided via the copilot environment secret
          echo "DATABASE_URL=$DATABASE_URL" >> .env

      # Note: No database schema creation step needed here because Supabase
      # is a persistent hosted database (not ephemeral). The schema exists
      # and persists across all Copilot sessions. Schema updates should be
      # done via `prisma migrate dev` locally and committed to version control.

      - name: Install skills CLI and find-skills capability
        run: |
          echo "Installing skills.sh CLI and find-skills skill..."
          # Install the find-skills skill which teaches agents how to discover and use skills
          # This is an agent instruction set, not the CLI itself
          npx --yes skills add vercel-labs/skills/find-skills -y || true
          echo "Skills CLI and find-skills capability available"
          echo "### Skills.sh Integration" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Available" >> $GITHUB_STEP_SUMMARY
          echo "- CLI: \`npx skills\`" >> $GITHUB_STEP_SUMMARY
          echo "- Find-skills skill: Teaches agents skill discovery patterns" >> $GITHUB_STEP_SUMMARY
          echo "- Usage: \`npx skills find <query>\`" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: https://skills.sh" >> $GITHUB_STEP_SUMMARY

      - name: Configure Ziit heartbeat hooks
        run: |
          # ZIIT_API_KEY should be configured in Settings → Secrets and variables → Copilot
          # (NOT in Codespaces secrets - Copilot environment secrets are different)
          if [ -n "${{ secrets.ZIIT_API_KEY }}" ]; then
            echo "Ziit hooks are configured in .github/hooks/hooks.json"
            echo "### Ziit Heartbeat Hooks" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ✅ Configured" >> $GITHUB_STEP_SUMMARY
            echo "- Configuration: \`.github/hooks/hooks.json\`" >> $GITHUB_STEP_SUMMARY
            echo "- Script: \`.github/hooks/ziit-heartbeat.js\`" >> $GITHUB_STEP_SUMMARY
            echo "- Project: \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Hooks: Session start/end, pre-tool-use" >> $GITHUB_STEP_SUMMARY
          else
            echo "ZIIT_API_KEY not set, hooks will be skipped"
            echo "Configure ZIIT_API_KEY in Settings → Secrets → Copilot (not Codespaces)"
            echo "### Ziit Heartbeat Hooks" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ⏭️ Skipped (ZIIT_API_KEY not configured)" >> $GITHUB_STEP_SUMMARY
            echo "- Setup: Go to Settings → Secrets and variables → Copilot" >> $GITHUB_STEP_SUMMARY
          fi
