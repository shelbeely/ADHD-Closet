name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        working-directory: ./app
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./app
        run: bunx prisma generate

      - name: Set up environment file
        working-directory: ./app
        run: |
          cp .env.example .env
          # DATABASE_URL is provided via the copilot environment secret
          echo "DATABASE_URL=$DATABASE_URL" >> .env

      # Note: No database schema creation step needed here because Supabase
      # is a persistent hosted database (not ephemeral). The schema exists
      # and persists across all Copilot sessions. Schema updates should be
      # done via `prisma migrate dev` locally and committed to version control.

      - name: Install skills CLI and find-skills capability
        run: |
          echo "Installing skills.sh CLI and find-skills skill..."
          # Install the find-skills skill which teaches agents how to discover and use skills
          # This is an agent instruction set, not the CLI itself
          npx --yes skills add vercel-labs/skills/find-skills -y || true
          echo "Skills CLI and find-skills capability available"
          echo "### Skills.sh Integration" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ✅ Available" >> $GITHUB_STEP_SUMMARY
          echo "- CLI: \`npx skills\`" >> $GITHUB_STEP_SUMMARY
          echo "- Find-skills skill: Teaches agents skill discovery patterns" >> $GITHUB_STEP_SUMMARY
          echo "- Usage: \`npx skills find <query>\`" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: https://skills.sh" >> $GITHUB_STEP_SUMMARY

      - name: Start Ziit heartbeat daemon
        working-directory: ./app
        env:
          ZIIT_API_KEY: ${{ secrets.ZIIT_API_KEY }}
          ZIIT_WORKDIR: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$ZIIT_API_KEY" ]; then
            echo "Starting Ziit watch daemon..."
            nohup bun run ziit:watch > /tmp/ziit-watch.log 2>&1 &
            ZIIT_PID=$!
            echo "Ziit daemon started with PID: $ZIIT_PID"
            echo "### Ziit Heartbeat Daemon" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ✅ Started" >> $GITHUB_STEP_SUMMARY
            echo "- PID: \`$ZIIT_PID\`" >> $GITHUB_STEP_SUMMARY
            echo "- Logs: \`/tmp/ziit-watch.log\`" >> $GITHUB_STEP_SUMMARY
            echo "- Project: \`$GITHUB_REPOSITORY\`" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ZIIT_API_KEY not set, skipping Ziit daemon"
            echo "### Ziit Heartbeat Daemon" >> $GITHUB_STEP_SUMMARY
            echo "- Status: ⏭️ Skipped (ZIIT_API_KEY not configured)" >> $GITHUB_STEP_SUMMARY
          fi
