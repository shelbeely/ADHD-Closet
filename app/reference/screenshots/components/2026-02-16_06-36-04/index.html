<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Screenshots - 2026-02-16_06-36-04</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      line-height: 1.6;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }
    .meta {
      color: #666;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #e0e0e0;
    }
    .meta a {
      color: #6750A4;
      text-decoration: none;
    }
    .meta a:hover {
      text-decoration: underline;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .component {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
      background: #fafafa;
    }
    .component h2 {
      font-size: 1.25rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .component .viewport {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #6750A4;
      color: white;
      border-radius: 4px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .component img {
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .component img:hover {
      transform: scale(1.02);
    }
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border: 2px solid white;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Component Screenshots</h1>
    <div class="meta">
      <p><strong>Captured:</strong> Invalid Date</p>
      <p><strong>Source:</strong> <a href="http://localhost:3000" target="_blank">http://localhost:3000</a></p>
      <p><strong>Total Components:</strong> 5</p>
    </div>

    <div class="grid">
      
        <div class="component">
          <h2>Header</h2>
          <span class="viewport">🖥️ desktop</span>
          <img 
            src="header_desktop.png" 
            alt="header"
            onclick="openLightbox(this.src)"
          />
        </div>
      
        <div class="component">
          <h2>Buttons</h2>
          <span class="viewport">🖥️ desktop</span>
          <img 
            src="buttons_desktop.png" 
            alt="buttons"
            onclick="openLightbox(this.src)"
          />
        </div>
      
        <div class="component">
          <h2>Fab</h2>
          <span class="viewport">📱 mobile</span>
          <img 
            src="fab_mobile.png" 
            alt="fab"
            onclick="openLightbox(this.src)"
          />
        </div>
      
        <div class="component">
          <h2>Category Tabs</h2>
          <span class="viewport">📱 mobile</span>
          <img 
            src="category-tabs_mobile.png" 
            alt="category-tabs"
            onclick="openLightbox(this.src)"
          />
        </div>
      
        <div class="component">
          <h2>Header</h2>
          <span class="viewport">📱 mobile</span>
          <img 
            src="header_mobile.png" 
            alt="header"
            onclick="openLightbox(this.src)"
          />
        </div>
      
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-image" src="" alt="Full size">
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-image').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>
</body>
</html>
